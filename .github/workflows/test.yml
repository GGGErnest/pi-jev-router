name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0.6.0
        with:
          nub-version: 0.1.10
          node-version: 22.19.0
      - run: nub install --frozen-lockfile --ignore-scripts
      - run: nub run test

  # The lockfile pins Pi 0.85.1; users run newer Pi releases. Smoke-test the
  # latest published Pi without touching the lockfile.
  smoke-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Smoke test against the latest published Pi
        run: bash scripts/smoke-latest.sh 0.99.1
